<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكشف الذكي | YOLO ONNX</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>نظام الكشف الذكي</h1>
            <p>حلول متقدمة للكشف عن الكائنات باستخدام تقنية YOLO و ONNX</p>
        </header>

        <nav>
            <a href="index.html" class="nav-link active">الكاميرا المباشرة</a>
            <a href="upload.html" class="nav-link">رفع الملفات</a>
        </nav>

        <main class="card">
            <div class="detection-box">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output"></canvas>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn">
                    <span>تشغيل الكاميرا</span>
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
                <div id="status" class="status-badge">بانتظار الإشارة...</div>
            </div>
        </main>

        <footer style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 2rem;">
            تم التطوير باستخدام FastAPI و YOLO ONNX
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
