<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكتشاف الكائنات YOLO في الوقت الحقيقي</title>

</head>
<body>

        <h1>اكتشاف الكائنات في الوقت الحقيقي (YOLOv8)</h1>
